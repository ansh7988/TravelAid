<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelAid — Offline</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #fafaf6; color: #26352b; }
      main { max-width: 480px; margin: 48px auto; padding: 24px; background: #fff; border: 1px solid #d6e0d4; border-radius: 10px; }
      h1 { color: #315744; font-size: 1.4rem; }
      a.call { display: inline-block; margin: 8px 0; background: #b83a3a; color: #fff; padding: 12px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; }
      a.retry { color: #315744; }
      li { margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>TravelAid cannot load this page without a connection.</p>
      <p><a class="call" href="tel:112">Call 112</a></p>
      <p>Once the app has loaded, the app itself and the contacts, trips and profile saved on this device still work offline.</p>
      <p>These need a connection: nearby search, map links, and WhatsApp.</p>
      <p><a class="retry" href="/">Try again</a></p>
    </main>
  </body>
</html>
